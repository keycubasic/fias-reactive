# smallrye
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/fias-reactive/swagger-ui
quarkus.swagger-ui.urls-primary-name=/fias-reactive/openapi
quarkus.smallrye-openapi.path=/fias-reactive/openapi
# quarkus.smallrye-health.ui.root-path=/fias-reactive/health
# quarkus.smallrye-metrics.path=/fias-reactive/metrics

quarkus.http.non-application-root-path=/

# cors
quarkus.http.cors=true
quarkus.http.cors.methods=GET,PUT,POST,OPTIONS,DELETE
quarkus.http.cors.exposed-headers=Content-Type,Accept,Authorization,responseType
quarkus.http.cors.access-control-max-age=86400
quarkus.http.cors.access-control-allow-credentials=true

# datasource
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=oracle
quarkus.datasource.username=
quarkus.datasource.password=
quarkus.datasource.reactive.url=oracle:thin:@fias_db

# native
quarkus.native.add-all-charsets=true

# logging
fias-filter.part=INFO
%dev.quarkus.log.console.json=false
%dev.fias-filter.part=ALL
%test.quarkus.log.console.json=false
%test.fias-filter.part=TEST

# org.eclipse.microprofile.rest.client.propagateHeaders=Authorization,Proxy-Authorization

# dadata
quarkus.rest-client.dadata.url=http://suggestions.dadata.ru
quarkus.rest-client.dadata.scope=javax.inject.Singleton
quarkus.rest-client.logging.scope=all

# quarkus.oidc-token-propagation.register-filter=true

quarkus.oidc-client.auth-server-url=
quarkus.oidc-client.client-id=
quarkus.oidc-client.scopes=
quarkus.oidc-client.credentials.secret=
quarkus.oidc-client.grant.type=password
quarkus.oidc-client.grant-options.password.username=
quarkus.oidc-client.grant-options.password.password=



